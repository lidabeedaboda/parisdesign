<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paris Design</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f5f5;
    color:#7A0B2B;
}

header{
    text-align:center;
    padding:30px;
    background:white;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.logo{
    width:350px;
    max-width:90%;
}

.topbar{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:20px;
    font-weight:bold;
}

.hero{
    text-align:center;
    padding:40px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding:40px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.info{
    padding:20px;
}

button{
    background:#7A0B2B;
    color:white;
    border:none;
    padding:12px;
    width:100%;
    cursor:pointer;
    border-radius:8px;
}

button:hover{
    opacity:.9;
}

footer{
    text-align:center;
    padding:40px;
}

.admin{
    position:fixed;
    bottom:20px;
    right:20px;
}
</style>
</head>
<body>

<header>
    <img src="paris.png" class="logo">
    <div class="topbar">
        <div>👜 Bag: <span id="bagCount">0</span></div>
        <div>⭐ Loyalty Points: <span id="points">0</span></div>
    </div>
</header>

<section class="hero">
    <h1>Paris Design & Fashion</h1>
    <p>Luxury fashion inspired by elegance.</p>
</section>

<div class="products" id="products"></div>

<footer>
    © 2026 Paris Design
</footer>

<button class="admin" onclick="adminLogin()">
Admin
</button>

<script>

// EASY PRODUCT LIST
const products = [
{
title:"Elegant Dress",
price:129,
image:"images/dress1.jpg"
},

{
title:"Luxury Handbag",
price:89,
image:"images/bag1.jpg"
},

{
title:"Designer Heels",
price:149,
image:"images/heels1.jpg"
}
];

// CART
let bag = 0;
let loyalty = localStorage.getItem("loyalty") || 0;

document.getElementById("points").innerText = loyalty;

const container = document.getElementById("products");

products.forEach(product => {

container.innerHTML += `
<div class="card">

<img src="${product.image}">

<div class="info">

<h2>${product.title}</h2>

<h3>$${product.price}</h3>

<button onclick="addToBag()">
Add to Bag
</button>

</div>
</div>
`;

});

function addToBag(){

bag++;

document.getElementById("bagCount").innerText = bag;

loyalty++;

localStorage.setItem("loyalty", loyalty);

document.getElementById("points").innerText = loyalty;

}

// ADMIN PLACEHOLDER
function adminLogin(){

let password = prompt("Admin password");

if(password === "parisadmin"){
alert("Admin panel coming soon.");
}
else{
alert("Incorrect password.");
}

}

</script>

</body>
</html>
