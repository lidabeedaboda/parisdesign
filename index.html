<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris Design</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f3f3;
            color: #7A0B2B;
            font-family: "Georgia", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        .logo {
            max-width: 500px;
            width: 90%;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            color: #8f3650;
            line-height: 1.7;
        }

        .divider {
            width: 80px;
            height: 2px;
            background: #7A0B2B;
            margin: 25px auto;
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #9c6a79;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            p {
                font-size: 1rem;
            }

            .logo {
                max-width: 350px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Paris Design Logo" class="logo">

        <h1>Coming Soon</h1>

        <div class="divider"></div>

        <p>
            Our website is currently under development.<br>
            Paris Design & Fashion will be launching soon.
        </p>

        <footer>
            © 2026 Paris Design & Fashion
        </footer>
    </div>

</body>
</html>
